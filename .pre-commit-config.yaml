minimum_pre_commit_version: 4.5.1
# See https://pre-commit.com for more information
# on pre-commit hooks and configuration.
# backup/ is walt_backup's byte-exact mirror of live dotfiles: fixer hooks
# rewriting it makes every backup commit fail (and the mirror drift).
exclude: (\.(html|svg|ipynb)$|^backup/)
# Hooks without an explicit `stages:` run at EVERY installed stage — and we
# install both pre-commit and pre-push (pcinstall). Pin the default so only
# explicitly-staged hooks (prevent-main-push) run at push time.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      # tex-fmt as a system hook (brew install tex-fmt; 0.5.7 at time of writing).
      # The upstream hook (github.com/WGUNDERWOOD/tex-fmt) is language:rust — it
      # downloads rustup to build from source, which Santa blocks on this Mac
      # ("No matching rule" → SIGKILL). The brew bottle is signed and allowed.
      - id: tex-fmt
        name: tex-fmt
        entry: tex-fmt
        language: system
        types: [tex]
      - id: prevent-main-push
        name: Prevent direct push to main
        # Scripts are referenced through the walters checkout ($WALT, falling back
        # to ~/coding/awalters) rather than ./zsh_scripts, so this config works
        # unchanged in other repos (projects_walt) and on other machines (spark).
        entry: bash -c 'source "${WALT:-$HOME/coding/awalters}/zsh_scripts/prevent_main_push.zsh" && prevent_main_push'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: pyright
        name: pyright type check
        # walters checkout appended to PYTHONPATH (same rule as memo-alias-lint) so
        # walt_utils imports resolve from other repos and from GUI commits that
        # don't inherit the shell's PYTHONPATH.
        entry: bash -c 'W="${WALT:-$HOME/coding/awalters}"; PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}$W" "$W/zsh_scripts/pyright_check.zsh" "$@"' --
        language: system
        types: [python]
        # pre-commit chunks large file lists into parallel invocations by default;
        # concurrent `npx pyright` runs corrupt the shared npm cache (ENOTEMPTY/ENOENT).
        require_serial: true
        stages: [pre-commit]
      - id: memo-alias-lint
        name: memo-alias-lint
        # bash -c so ~ and $WALT expand (pre-commit does not run `entry` through
        # a shell); filenames arrive as "$@" after the `--`. walt_utils is NOT
        # installed in the env — the walters repo on PYTHONPATH (appended,
        # house rule; $WALT with a fallback for env-less commits) resolves it,
        # keeping this entry IDENTICAL across repos instead of relying on the
        # repo-root cwd.
        # `python` (not a hardcoded interpreter path) so this follows whichever
        # env is active: the old ~/miniconda3/envs/walt_312 path only ever
        # existed on the machine this repo came from.
        entry: bash -c 'PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}${WALT:-$HOME/coding/awalters}" python -m walt_utils.memo_alias_lint "$@"' --
        language: system
        types: [python]
        # match the module's default-sweep scope: production memo bodies only,
        # not pytest_* fixtures (throwaway memo classes) or notebooks.
        exclude: '(^|/)pytest_[^/]*\.py$|/notebooks/'
        stages: [pre-commit]
  - repo: https://github.com/myint/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        args:
          [
            '--remove-all-unused-imports',
            '--remove-unused-variables',
            '--ignore-init-module-imports',
          ]
        # Use the 'exclude' key to ignore files matching a regex pattern
        exclude: |
          (?x)^(
            sandbox/.*|
            tests/.*|
            ^.*nb_imports.py
          )$
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        name: black
        args: [--safe, --quiet]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # these declare their own multi-stage `stages:` upstream, which
      # overrides default_stages — pin them to pre-commit explicitly
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: debug-statements
      - id: name-tests-test
      - id: requirements-txt-fixer
      - id: check-added-large-files
        args: [--maxkb=10000]
        stages: [pre-commit]
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-builtin-literals
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-symlinks
        # dotfiles/<platform>/ symlinks are backup declarations targeting $HOME
        # paths of the OTHER machine too — linux/ is always broken on the mac
        # and macbook/ on linux. walt_backup warns on truly broken ones itself.
        exclude: ^dotfiles/
      - id: check-xml
      - id: pretty-format-json
        # indent 4 matches CondaUtils.update_latest_versions_json (json.dump indent=4)
        args: [--autofix, --indent, '4', --no-sort-keys]
        # Claude settings are written by Claude Code / jean-claude in their own
        # format (2-space); reformatting them only creates diffs, and through a
        # dotfiles/ symlink it would rewrite the live ~/.claude/settings.json.
        # npm (package*.json), tsc and Chrome tooling write these 2-space; a 4-space
        # rewrite gets undone by the next `npm install` and churns the lockfile.
        exclude: ^backup/|(^|/)claude-settings\.json$|(^|/)\.claude/|^(package(-lock)?|tsconfig)\.json$|^extension/manifest\.json$
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
  - repo: https://github.com/asottile/setup-cfg-fmt
    rev: v3.2.0
    hooks:
      - id: setup-cfg-fmt
  # - repo: https://github.com/asottile/add-trailing-comma NOTE: this was annoying for function signatures
  #   rev: v3.1.0
  #   hooks:
  #     - id: add-trailing-comma
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
